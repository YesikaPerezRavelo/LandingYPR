<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar sesión</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>


  <div class="login-container">
    <h2>Iniciar <span class="highlight">sesión</span></h2>


    <form id="login-form">
      <label for="email">Ingrese email</label>
      <input type="email" id="email" placeholder="Correo electrónico *" required />


      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="Contraseña *" required />


      <a href="/forgot-password.html" class="forgot-password">¿Olvidaste la contraseña?</a>


      <button type="submit">Ingresar</button>
    </form>


    <p class="register-link">¿No tienes una cuenta? <a href="/registro.html">Regístrate</a></p>


    <p id="error-msg" class="error-msg"></p>
  </div>


  <script src="login.js"></script>
</body>
</html>
